<div class="page">

  <div class="top-bar">
    <h2>Pagos</h2>

    <div class="menu-buttons">
      <button mat-raised-button class="btn-ninera" routerLink="/home-cliente">
        Home
      </button>

      <button mat-raised-button class="btn-ninera" (click)="listarPagos()">
        Listar
      </button>

      <button mat-raised-button class="btn-ninera" (click)="registrarPago()">
        Registrar
      </button>
    </div>
  </div>

  <div class="table-container">

    <table mat-table [dataSource]="dataSource" class="tabla-pagos">

      <ng-container matColumnDef="idPago">
        <th mat-header-cell *matHeaderCellDef>Id</th>
        <td mat-cell *matCellDef="let pago">{{ pago.idPago }}</td>
      </ng-container>

      <ng-container matColumnDef="idReserva">
        <th mat-header-cell *matHeaderCellDef>Reserva</th>
        <td mat-cell *matCellDef="let pago">{{ pago.idReserva }}</td>
      </ng-container>

      <ng-container matColumnDef="montoPago">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let pago">S/ {{ pago.montoPago }}</td>
      </ng-container>

      <ng-container matColumnDef="metodoPago">
        <th mat-header-cell *matHeaderCellDef>Método</th>
        <td mat-cell *matCellDef="let pago">{{ pago.metodoPago }}</td>
      </ng-container>

      <ng-container matColumnDef="estadoPago">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let pago">
          {{ pago.estadoPago ? 'Pagado' : 'Pendiente' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="pagadaEn">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let pago">
          {{ pago.pagadaEn | date:'dd/MM/yyyy HH:mm':'-0500' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let pago">
          <button
            mat-raised-button
            class="btn-delete"
            (click)="eliminarPago(pago.idPago)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="actualizar">
        <th mat-header-cell *matHeaderCellDef>Actualizar</th>
        <td mat-cell *matCellDef="let pago">
          <button
            mat-raised-button
            class="btn-edit"
            (click)="actualizarPago(pago)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

    </table>

    <mat-paginator
      [pageSize]="4"
      [pageSizeOptions]="[4, 8, 12]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
