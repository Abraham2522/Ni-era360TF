<div class="page">

  <div class="top-bar">
    <h2>Chats Cliente</h2>

    <div class="menu-buttons">
      <button mat-raised-button class="btn-ninera" routerLink="/home-cliente">
        Home
      </button>

      <button mat-raised-button class="btn-ninera" (click)="listarChats()">
        Listar
      </button>

      <button mat-raised-button class="btn-ninera" (click)="registrarChat()">
        Registrar
      </button>
    </div>
  </div>

  <div class="table-container">

    <table mat-table [dataSource]="dataSource" class="tabla-chats">

      <ng-container matColumnDef="idChat">
        <th mat-header-cell *matHeaderCellDef>Id</th>
        <td mat-cell *matCellDef="let chat">
          {{ chat.idChat }}
        </td>
      </ng-container>

      <ng-container matColumnDef="idCliente">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let chat">
          {{ chat.idCliente }}
        </td>
      </ng-container>

      <ng-container matColumnDef="idCuidador">
        <th mat-header-cell *matHeaderCellDef>Cuidador</th>
        <td mat-cell *matCellDef="let chat">
          {{ chat.idCuidador }}
        </td>
      </ng-container>

      <ng-container matColumnDef="creadoEn">
        <th mat-header-cell *matHeaderCellDef>Creado en</th>
        <td mat-cell *matCellDef="let chat">
          {{ chat.creadoEn | date:'dd/MM/yyyy hh:mm a' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let chat">
          {{ chat.activo ? 'Sí' : 'No' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let chat">
          <button
            mat-raised-button
            class="btn-delete"
            (click)="eliminarChat(chat.idChat)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="actualizar">
        <th mat-header-cell *matHeaderCellDef>Actualizar</th>
        <td mat-cell *matCellDef="let chat">
          <button
            mat-raised-button
            class="btn-edit"
            (click)="actualizarChat(chat)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

    </table>

    <mat-paginator
      [pageSize]="4"
      [pageSizeOptions]="[4, 8, 12]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
