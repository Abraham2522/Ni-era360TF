<div class="perfil-page">

  <div class="header-section">
    <button mat-stroked-button color="primary" routerLink="/home-cliente">
      ← Volver
    </button>

    <div>
      <h1>Mi perfil 👤</h1>
      <p>Actualiza tu información personal y preferencias.</p>
    </div>
  </div>

  <div class="perfil-layout">

    <mat-card class="profile-card">
      <div class="avatar">👤</div>
      <h2>{{ usuario.nombre }} {{ usuario.apellidos }}</h2>
      <p>Cliente verificado</p>

      <div class="profile-stats">
        <div>
          <h3>12</h3>
          <span>Reservas</span>
        </div>

        <div>
          <h3>4.9</h3>
          <span>Calificación</span>
        </div>
      </div>
    </mat-card>

    <mat-card class="form-card">
      <h2>Información personal</h2>

      <div class="form-grid">

        <mat-form-field appearance="outline">
          <mat-label>Nombres</mat-label>
          <input matInput name="nombre" [(ngModel)]="usuario.nombre">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Apellidos</mat-label>
          <input matInput name="apellidos" [(ngModel)]="usuario.apellidos">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>DNI</mat-label>
          <input matInput name="dni" [(ngModel)]="usuario.dni">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico</mat-label>
          <input matInput name="correo" [(ngModel)]="usuario.correo">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput name="telefono" [(ngModel)]="usuario.telefono">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Dirección</mat-label>
          <input matInput name="direccion" [(ngModel)]="usuario.direccion">
        </mat-form-field>


      </div>

      <div class="actions">
        <button mat-stroked-button color="warn" (click)="eliminarCuenta()">
          Desactivar cuenta
        </button>

        <button mat-raised-button color="primary" (click)="guardarCambios()">
          Guardar cambios
        </button>
      </div>
    </mat-card>

  </div>

</div>
