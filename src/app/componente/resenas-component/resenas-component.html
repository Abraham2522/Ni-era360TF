<div class="page">

  <div class="top-bar">
    <h2>Reseñas</h2>

    <div class="menu-buttons">

      <button
        mat-raised-button
        class="btn-ninera"
        routerLink="/home-cliente">
        Home
      </button>

      <button
        mat-raised-button
        class="btn-ninera"
        (click)="listarResenas()">
        Listar
      </button>

      <button
        mat-raised-button
        class="btn-ninera"
        (click)="registrarResena()">
        Registrar
      </button>

    </div>
  </div>

  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource"
      class="tabla-resenas">

      <!-- ID -->

      <ng-container matColumnDef="idResena">
        <th mat-header-cell *matHeaderCellDef>
          Id
        </th>

        <td mat-cell *matCellDef="let resena">
          {{ resena.idResena }}
        </td>
      </ng-container>

      <!-- RESERVA -->

      <ng-container matColumnDef="idReserva">
        <th mat-header-cell *matHeaderCellDef>
          Reserva
        </th>

        <td mat-cell *matCellDef="let resena">
          {{ resena.idReserva }}
        </td>
      </ng-container>

      <!-- CALIFICACION -->

      <ng-container matColumnDef="calificacion">
        <th mat-header-cell *matHeaderCellDef>
          Calificación
        </th>

        <td mat-cell *matCellDef="let resena">
          ⭐ {{ resena.calificacion }}
        </td>
      </ng-container>

      <!-- COMENTARIO -->

      <ng-container matColumnDef="comentario">
        <th mat-header-cell *matHeaderCellDef>
          Comentario
        </th>

        <td mat-cell *matCellDef="let resena">
          {{ resena.comentario }}
        </td>
      </ng-container>

      <!-- FECHA -->

      <ng-container matColumnDef="creadoEn">
        <th mat-header-cell *matHeaderCellDef>
          Fecha
        </th>

        <td mat-cell *matCellDef="let resena">
          {{ resena.creadoEn | date:'dd/MM/yyyy HH:mm':'-0500' }}
        </td>
      </ng-container>

      <!-- ACTIVO -->

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>
          Estado
        </th>

        <td mat-cell *matCellDef="let resena">
          {{ resena.activo ? 'Activo' : 'Inactivo' }}
        </td>
      </ng-container>

      <!-- ELIMINAR -->

      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>
          Eliminar
        </th>

        <td mat-cell *matCellDef="let resena">

          <button
            mat-raised-button
            class="btn-delete"
            (click)="eliminarResena(resena.idResena)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>
      </ng-container>

      <!-- ACTUALIZAR -->

      <ng-container matColumnDef="actualizar">
        <th mat-header-cell *matHeaderCellDef>
          Actualizar
        </th>

        <td mat-cell *matCellDef="let resena">

          <button
            mat-raised-button
            class="btn-edit"
            (click)="actualizarResena(resena)">

            <mat-icon>edit</mat-icon>

          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>

      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

    </table>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5,10,15]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
